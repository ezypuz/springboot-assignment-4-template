name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Docker Build & Push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-seminar:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-seminar:latest

      - name: Deploy to K3s
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            export KUBECONFIG=~/.kube/config
            kubectl apply -f /home/ubuntu/k8s-app.yaml
            kubectl set image deployment/spring-app \
              spring-app=${{ secrets.DOCKER_USERNAME }}/spring-seminar:latest
            kubectl rollout status deployment/spring-app -n default --timeout=5m
