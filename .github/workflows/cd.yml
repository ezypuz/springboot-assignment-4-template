name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ] # 오직 main 브랜치에 코드가 합쳐질 때만 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # CD에서는 테스트를 생략(-x test)하여 속도를 높입니다.
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Docker Build & Push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-seminar:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-seminar:latest

      - name: Copy k8s-app.yaml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "k8s-app.yaml"
          target: "/home/ubuntu/"

      - name: Deploy to K3s
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            sudo kubectl apply --validate=false -f /home/ubuntu/k8s-app.yaml
            sudo kubectl rollout restart deployment/spring-app --request-timeout=5m
