name: Continuous Integration (CI)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create dummy application.yaml
        run: |
          mkdir -p src/main/resources
          echo "spring:" > src/main/resources/application.yaml
          echo "  datasource:" >> src/main/resources/application.yaml
          echo "    url: jdbc:mysql://localhost:3306/mydb" >> src/main/resources/application.yaml

      - name: Run Tests with Gradle
        run: |
          chmod +x gradlew
          ./gradlew test
        env:
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: "testsecretkeytestsecretkeytestsecretkeytestsecretkey"
          JWT_EXPIRATION_IN_MS: 3600000
