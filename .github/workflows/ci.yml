name: Continuous Integration (CI)

on:
  push:
    branches: [ "**" ] # 모든 브랜치에서 실행 (기능 개발 중에도 테스트)
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 여기서 테스트를 수행합니다!
      - name: Run Tests with Gradle
        run: |
          chmod +x gradlew
          ./gradlew test
